# ░█▀█░▀█▀░█▀▀░█▀█░█▄█░░░░█▀▀░█▀█░█▀█░█▀▀
# ░█▀▀░░█░░█░░░█░█░█░█░░░░█░░░█░█░█░█░█▀▀
# ░▀░░░▀▀▀░▀▀▀░▀▀▀░▀░▀░▀░░▀▀▀░▀▀▀░▀░▀░▀░░
#
#  X compositor configuration
#  Optimized for MacBook Air 2017
#  Arch Linux + i3wm


# ░█▀▀░█▀█░█▀▄░█▀█░█▀▀░█▀▄░█▀▀
# ░█░░░█░█░█▀▄░█░█░█▀▀░█▀▄░▀▀█
# ░▀▀▀░▀▀▀░▀░▀░▀░▀░▀▀▀░▀░▀░▀▀▀

corner-radius = 0;

rounded-corners-exclude = [
  "class_g ?= 'rofi'",
  "window_type *= 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'"
];


# ░█▀▀░█░█░█▀█░█▀▄░█▀█░█░█
# ░▀▀█░█▀█░█▀█░█░█░█░█░█▄█
# ░▀▀▀░▀░▀░▀░▀░▀▀░░▀▀▀░▀░▀

shadow = false;
shadow-radius = 8;
shadow-opacity = 0.5;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#000000";
crop-shadow-to-monitor = true;
shadow-ignore-shaped = false;

shadow-exclude = [
  "class_g = 'slop'",
  "window_type = 'utility'",
  "window_type = 'dropdown_menu'"
];


# ░█▀▀░█▀█░█▀▄░▀█▀░█▀█░█▀▀
# ░█▀▀░█▀█░█░█░░█░░█░█░█░█
# ░▀░░░▀░▀░▀▀░░▀▀▀░▀░▀░▀▀▀

fading = true;

fade-in-step = 0.04;
fade-out-step = 0.04;

fade-delta = 8;

no-fading-openclose = false;
no-fading-destroyed-argb = true;

fade-exclude = [
  "class_g = 'slop'"
];


# ░█▀█░█▀█░█▀█░█▀▀░▀█▀░▀█▀░█░█
# ░█░█░█▀▀░█▀█░█░░░░█░░░█░░░█░
# ░▀▀▀░▀░░░▀░▀░▀▀▀░▀▀▀░░▀░░░▀░

active-opacity = 1.0;
inactive-opacity = 1.0;

frame-opacity = 1.0;
inactive-dim = 0.0;

opacity-rule = [
     "90:class_g = 'Polybar'",
     "92:class_g = 'Pavucontrol'",
     "92:class_g = 'Thunar'",
     "92:class_g = 'Xreader'",
     "92:class_g = 'Zathura'",
     "92:class_g = 'Geany'",
     "90:class_g = 'Alacritty'",
     "88:class_g = 'Dunst'",
     "92:class_g = 'Lxappearance'"
];

focus-exclude = [
    "class_g ?= 'rofi'",
    "class_g ?= 'slop'"
];


# ░█▀▄░█░░░█░█░█▀▄░█▀▄░▀█▀░█▀█░█▀▀
# ░█▀▄░█░░░█░█░█▀▄░█▀▄░░█░░█░█░█░█
# ░▀▀░░▀▀▀░▀▀▀░▀░▀░▀░▀░▀▀▀░▀░▀░▀░▀

blur:
{
  method = "dual_kawase";
  strength = 4;

  background = false;
  background-frame = false;
  background-fixed = false;

  blur-kern = "3x3box";
}

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'slop'",
    "class_g = 'firefox'",
    "class_g = 'Google-chrome'",
    "class_g = 'Code'"
];


# ░█▀▀░█▀▀░█▀█░█▀▀░█▀▄░█▀█░█░░░░░█▀▀░█▀▀░▀█▀░▀█▀░▀█▀░█▀█░█▀▀░█▀▀
# ░█░█░█▀▀░█░█░█▀▀░█▀▄░█▀█░█░░░░░▀▀█░█▀▀░░█░░░█░░░█░░█░█░█░█░▀▀█
# ░▀▀▀░▀▀▀░▀░▀░▀▀▀░▀░▀░▀░▀░▀▀▀░░░▀▀▀░▀▀▀░░▀░░░▀░░▀▀▀░▀░▀░▀▀▀░▀▀▀

backend = "glx";

vsync = true;
use-damage = true;

glx-copy-from-front = false;

detect-rounded-corners = true;
detect-client-leader = true;
detect-transient = true;
detect-client-opacity = true;

mark-ovredir-focused = true;
mark-wmwin-focused = true;

unredir-if-possible = false;


wintypes:
{
  tooltip =
  {
    fade = true;
    shadow = false;
    focus = true;
    opacity = 0.95;
  };

  menu =
  {
    shadow = false;
  };

  popup_menu =
  {
    opacity = 0.95;
  };

  dropdown_menu =
  {
    opacity = 0.95;
  };

  utility =
  {
    shadow = false;
  };

  toolbar =
  {
    shadow = false;
  };

  normal =
  {
    shadow = false;
  };

  dialog =
  {
    shadow = false;
  };

  dock =
  {
    shadow = false;
  };
};
