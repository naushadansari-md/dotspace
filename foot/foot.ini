# -*- conf -*-
# Foot Terminal Configuration - Optimized for Wayland (Zsh)

[main]
shell=/usr/bin/zsh
font=FiraCode Nerd Font:size=11
font-bold=FiraCode Nerd Font:style=Bold:size=11
font-italic=FiraCode Nerd Font:style=Italic:size=11
pad=12x12 center
initial-window-size-chars=90x24

[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} "${title}" "${body}"

[scrollback]
lines=5000

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+r

# Include Matugen color scheme (Placed at the top level, outside any active section)
[main]
include=~/.config/foot/foot-colors.ini
