# =====================================================================
# WINDOW STYLES, BORDERS & LAYOUTS
# =====================================================================

# Default layout engine
workspace_layout default

# Window border configurations
default_border          pixel 1
default_floating_border normal 
hide_edge_borders       none

# Dynamic border toggle bindings
bindsym $mod+u border none
bindsym $mod+y border pixel 1

# Window title bar padding and formatting
for_window [class=".*"] title_format "  %title"

# =====================================================================
# I3 WINDOW MANAGER CORE CONTROLS
# =====================================================================

# Reload configuration changes dynamically
bindsym $mod+Shift+c reload

# Restart i3 in place (Preserves open windows)
bindsym $mod+Shift+r restart

# =====================================================================
# SCREENSHOT UTILITY ENGINE (MAIM)
# =====================================================================

# --- Save Directly to Storage Files ---
# Fullscreen Capture
bindsym $alt+p exec --no-startup-id "mkdir -p ~/Pictures/Screenshots && maim --format=png ~/Pictures/Screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-all.png"

# Focused Window Capture
bindsym $alt+Shift+p exec --no-startup-id "mkdir -p ~/Pictures/Screenshots && maim --format=png --window $(xdotool getactivewindow) ~/Pictures/Screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-current.png"

# Selected Region/Area Capture
bindsym Ctrl+Shift+p exec --no-startup-id "mkdir -p ~/Pictures/Screenshots && maim --format=png --select ~/Pictures/Screenshots/screenshot-$(date -u +'%Y%m%d-%H%M%SZ')-selected.png"

# --- Save Directly to System Clipboard ---
# Fullscreen to Clipboard
bindsym Ctrl+Print exec --no-startup-id "maim --format=png | xclip -selection clipboard -t image/png"

# Focused Window to Clipboard
bindsym Ctrl+$mod+Print exec --no-startup-id "maim --format=png --window $(xdotool getactivewindow) | xclip -selection clipboard -t image/png"

# Selected Region to Clipboard
bindsym Ctrl+Shift+Print exec --no-startup-id "maim --format=png --select | xclip -selection clipboard -t image/png"

# =====================================================================
# WORKSPACE DEFINITIONS & RULES
# =====================================================================

# Navigation Tweaks
workspace_auto_back_and_forth yes
bindsym $mod+b       workspace back_and_forth
bindsym $mod+Shift+b move container to workspace back_and_forth; workspace back_and_forth

# Switch/Iterate between workspaces
bindsym $mod+Tab        workspace next
bindsym $mod+Shift+Tab  workspace prev
bindsym $alt+Tab        workspace next
bindsym $alt+Shift+Tab  workspace prev
bindsym $Control+Tab    exec --no-startup-id ~/.config/i3/scripts/i3-cycle-focus.py --switch

# Workspace Variables
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"

# Target Window Workspace Assignments
assign [class="Alacritty"]             $ws1
assign [class="(?i)firefox"]           $ws2
assign [class="(?i)thunderbird"]       $ws3
assign [class="Thunar"]                $ws4
assign [class="jetbrains-idea-ce"]     $ws5
assign [class="Google-chrome"]         $ws6
assign [class="Geany"]                 $ws7
assign [class="Zathura"]               $ws8
assign [class="Code"]                  $ws9

# Target Auto-Focus Rules
for_window [class="Alacritty"]             focus
for_window [class="(?i)firefox"]           focus
for_window [class="(?i)thunderbird"]       focus
for_window [class="Thunar"]                focus
for_window [class="jetbrains-idea-ce"]     focus
for_window [class="Google-chrome"]         focus
for_window [class="Geany"]                 focus
for_window [class="Zathura"]               focus
for_window [class="Code"]                  focus

# Urgency Focus Management
for_window [urgent="latest"] focus
focus_on_window_activation   focus 

# Switch to Workspace Bindings
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9

# Move Container to Workspace Bindings
bindsym $mod+Shift+1 move container to workspace $ws1; workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2; workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3; workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4; workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5; workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6; workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7; workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8; workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9; workspace $ws9