# =====================================================================
# DYNAMIC XRESOURCES COLORS (PYWAL)
# =====================================================================

# Fetch colors from Xresources with fallback defaults
set_from_resource $fg        i3wm.color7 #fdf6e3
set_from_resource $bg_dark   i3wm.color0 #1d1f21
set_from_resource $accent    i3wm.color2 #8f8f8f
set_from_resource $inactive  i3wm.color8 #707880
set_from_resource $urgent    i3wm.color1 #a54242

# =====================================================================
# WINDOW BORDER COLORS & STYLES
# =====================================================================
# class                 border     backgr.    text     indicator  child_border
client.focused          $accent    $accent    $bg_dark $accent    $accent
client.focused_inactive $inactive  $inactive  $fg      $inactive  $inactive
client.unfocused        $bg_dark   $bg_dark   $inactive $bg_dark   $bg_dark
client.urgent           $urgent    $urgent    $fg      $urgent    $urgent
client.placeholder      $bg_dark   $bg_dark   $fg      $bg_dark   $bg_dark

client.background       $bg_dark