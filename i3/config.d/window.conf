# =====================================================================
# AUTOMATIC FLOATING WINDOW ASSIGNMENTS
# =====================================================================

# --- System & Hardware Management Tools ---
for_window [class="GParted"]                          floating enable border normal
for_window [class="Lightdm-settings"]                 floating enable
for_window [class="org.gnome.FileRoller"]             floating enable 
for_window [title="(?i)Network Connections"]          floating enable

# --- Audio Controls ---
for_window [class="pavucontrol"]                      floating enable sticky enable border normal
for_window [title="(?i)Volume Control"]               floating enable sticky enable 

# --- Bluetooth Panels (Supporting multiple management variants) ---
for_window [class="Blueberry.py"]                     floating enable
for_window [class="(?i)blueman-manager"]              floating enable sticky enable border normal

# --- Appearance & Theme Customizers ---
for_window [class="Lxappearance"]                     floating enable sticky enable border normal
for_window [class="Nwg-look"]                         floating enable sticky enable
for_window [class="qt5ct"]                            floating enable sticky enable border normal

# --- File Operations & Dynamic Transfers ---
for_window [title="File Transfer.*"]                  floating enable
for_window [title="(?i)(?:copying|deleting|moving|extract|compress)"] floating enable 

# =====================================================================
# MODAL DIALOGS, ALERTS & POP-UPS
# =====================================================================
for_window [window_role="(?i)(?:pop-up|app|bubble|page-info|setup|task_dialog|dialog|menu|Preferences)"] floating enable 
for_window [window_type="(?i)(?:dialog|menu|utility|toolbar|splash)"]                                    floating enable