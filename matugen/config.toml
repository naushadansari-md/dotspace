[config]
reload_apps = false
set_wallpaper = false

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors/colors.lua'
post_hook = 'if [ -n "$HYPRLAND_INSTANCE_SIGNATURE" ]; then hyprctl reload; fi'

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'
post_hook = 'if [ -n "$NIRI_SOCKET" ]; then niri msg action load-config-file; fi'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.nwgdock]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/nwg-dock-hyprland/colors.css'

[templates.foot]
input_path  = '~/.config/matugen/templates/foot-colors.ini'
output_path = '~/.config/matugen/generated/foot-colors.ini'
post_hook   = '''
  pkill -SIGUSR1 foot
  ln -nfs "$HOME/.config/matugen/generated/foot-colors.ini" "$HOME/.config/foot/foot-colors.ini"
  touch "$HOME/.config/foot/foot.ini" || :
'''

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook = 'swaync-client -rs 2>/dev/null || true'

[templates.nwg_drawer]
input_path = '~/.config/matugen/templates/nwg-drawer.css'
output_path = '~/.config/nwg-drawer/drawer.css'
post_hook = 'pkill -u "$USER" -x nwg-drawer 2>/dev/null || true'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'
post_hook = 'pkill -u "$USER" -x rofi 2>/dev/null || true'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
