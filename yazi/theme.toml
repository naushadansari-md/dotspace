# ===============================
# YAZI - MATUGEN TEMPLATE
# ===============================

# : Manager [[[

[mgr]
cwd = { fg = "#efdfe2" }

find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

marker_copied   = { fg = "#2e1500", bg = "#ffdcc2" }
marker_cut      = { fg = "#541d33", bg = "#ffb0c9" }
marker_marked   = { fg = "#690005", bg = "#ffb4ab" }
marker_selected = { fg = "#422931", bg = "#e2bdc7" }

count_copied   = { fg = "#2e1500", bg = "#ffdcc2" }
count_cut      = { fg = "#541d33", bg = "#ffb0c9" }
count_selected = { fg = "#422931", bg = "#e2bdc7" }

border_symbol = "│"
border_style  = { fg = "#514347" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffb0c9", bold = true, bg = "#191113" }
inactive  = { fg = "#d5c2c6", bg = "#191113" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
normal_main = { bg = "#ffb0c9", fg = "#541d33", bold = true }
normal_alt  = { bg = "#514347", fg = "#d5c2c6" }

select_main = { bg = "#e2bdc7", fg = "#422931", bold = true }
select_alt  = { bg = "#514347", fg = "#d5c2c6" }

unset_main  = { bg = "#efbc94", fg = "#48290c", bold = true }
unset_alt   = { bg = "#514347", fg = "#d5c2c6" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#e2bdc7" }
perm_write = { fg = "#efbc94" }
perm_read  = { fg = "#ffb0c9" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#ffb0c9" }

progress_label  = { bold = true }
progress_normal = { fg = "#ffb0c9", bg = "#261d20" }
progress_error  = { fg = "#ffb4ab", bg = "#261d20" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#261d20" }
cand = { fg = "#ffb0c9" }
rest = { fg = "#efdfe2" }
desc = { fg = "#d5c2c6" }
separator = " ▶ "
separator_style = { fg = "#ffb0c9" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#ffb0c9" }
title_warn  = { fg = "#e2bdc7" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffb0c9" }
active = { fg = "#efbc94", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb0c9" }
value  = { fg = "#efdfe2" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb0c9", bg = "#261d20" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffb0c9" }
hovered = { fg = "#efbc94", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#efdfe2" }
run    = { fg = "#ffb0c9" }
footer = { fg = "#422931", bg = "#e2bdc7" }

# : ]]]


# : Icons [[[

[icon]
append_exts = [
  { name = "pdf",  text = "󰈦" },
  { name = "md",   text = "" },
  { name = "txt",  text = "" },
  { name = "zip",  text = "" },
  { name = "tar",  text = "" },
  { name = "gz",   text = "" },
  { name = "png",  text = "󰉏" },
  { name = "jpg",  text = "󰉏" },
  { name = "mp4",  text = "" },
  { name = "mp3",  text = "" },
  { name = "py",   text = "" },
  { name = "js",   text = "" },
  { name = "rs",   text = "" },
  { name = "go",   text = "" },
  { name = "sh",   text = "" },
  { name = "json", text = "󰘦" },
  { name = "toml", text = "" },
]

# : ]]]


# : Filetype [[[

[filetype]
rules = [
  { mime = "image/*", fg = "#efbc94" },
  { mime = "{audio,video}/*", fg = "#e2bdc7" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress}", fg = "#ffb0c9" },
  { mime = "application/{pdf,doc,docx,rtf}", fg = "#ffb0c9" },

  { name = "*", is = "orphan", bg = "#93000a" },
  { name = "*", is = "exec", fg = "#efbc94" },

  { url = "*",  fg = "#efdfe2" },
  { url = "*/", fg = "#ffb0c9" },
]

# : ]]]
