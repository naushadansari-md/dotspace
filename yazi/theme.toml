# ===============================
# YAZI - MATUGEN TEMPLATE
# ===============================

# : Manager [[[

[mgr]
cwd = { fg = "#f0dfd6" }

find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

marker_copied   = { fg = "#1b1d00", bg = "#e3e7af" }
marker_cut      = { fg = "#4e2500", bg = "#ffb781" }
marker_marked   = { fg = "#690005", bg = "#ffb4ab" }
marker_selected = { fg = "#422b1a", bg = "#e4bfa7" }

count_copied   = { fg = "#1b1d00", bg = "#e3e7af" }
count_cut      = { fg = "#4e2500", bg = "#ffb781" }
count_selected = { fg = "#422b1a", bg = "#e4bfa7" }

border_symbol = "│"
border_style  = { fg = "#52443b" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffb781", bold = true, bg = "#19120d" }
inactive  = { fg = "#d6c3b7", bg = "#19120d" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
normal_main = { bg = "#ffb781", fg = "#4e2500", bold = true }
normal_alt  = { bg = "#52443b", fg = "#d6c3b7" }

select_main = { bg = "#e4bfa7", fg = "#422b1a", bold = true }
select_alt  = { bg = "#52443b", fg = "#d6c3b7" }

unset_main  = { bg = "#c7ca95", fg = "#2f330c", bold = true }
unset_alt   = { bg = "#52443b", fg = "#d6c3b7" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#e4bfa7" }
perm_write = { fg = "#c7ca95" }
perm_read  = { fg = "#ffb781" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#ffb781" }

progress_label  = { bold = true }
progress_normal = { fg = "#ffb781", bg = "#261e18" }
progress_error  = { fg = "#ffb4ab", bg = "#261e18" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#261e18" }
cand = { fg = "#ffb781" }
rest = { fg = "#f0dfd6" }
desc = { fg = "#d6c3b7" }
separator = " ▶ "
separator_style = { fg = "#ffb781" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#ffb781" }
title_warn  = { fg = "#e4bfa7" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffb781" }
active = { fg = "#c7ca95", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb781" }
value  = { fg = "#f0dfd6" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb781", bg = "#261e18" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffb781" }
hovered = { fg = "#c7ca95", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#f0dfd6" }
run    = { fg = "#ffb781" }
footer = { fg = "#422b1a", bg = "#e4bfa7" }

# : ]]]


# : Icons [[[

[icon]
append_exts = [
  { name = "pdf",  text = "󰈦" },
  { name = "md",   text = "" },
  { name = "txt",  text = "" },
  { name = "zip",  text = "" },
  { name = "tar",  text = "" },
  { name = "gz",   text = "" },
  { name = "png",  text = "󰉏" },
  { name = "jpg",  text = "󰉏" },
  { name = "mp4",  text = "" },
  { name = "mp3",  text = "" },
  { name = "py",   text = "" },
  { name = "js",   text = "" },
  { name = "rs",   text = "" },
  { name = "go",   text = "" },
  { name = "sh",   text = "" },
  { name = "json", text = "󰘦" },
  { name = "toml", text = "" },
]

# : ]]]


# : Filetype [[[

[filetype]
rules = [
  { mime = "image/*", fg = "#c7ca95" },
  { mime = "{audio,video}/*", fg = "#e4bfa7" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress}", fg = "#ffb781" },
  { mime = "application/{pdf,doc,docx,rtf}", fg = "#ffb781" },

  { url = "*", is = "orphan", bg = "#93000a" },
  { url = "*", is = "exec", fg = "#c7ca95" },

  { url = "*",  fg = "#f0dfd6" },
  { url = "*/", fg = "#ffb781" },
]

# : ]]]
