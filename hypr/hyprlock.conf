# ============================================================
# Hyprlock - General (MacBook Air 2017 Hardware Sync)
# ============================================================

general {
    disable_loading_bar = true
    grace               = 1 
    hide_cursor         = true
    no_fade_in          = false
    # Prevents double-buffering lag on older Intel graphics
    ignore_empty_input  = true
}

# ============================================================
# Hyprlock - Background
# ============================================================

background {
    monitor     =
    # Optimized: Path remains the same, but blur_passes is kept low
    # to avoid GPU stutter when waking up the display.
    path        = /home/$USER/.cache/blurred_wallpaper.png
    blur_passes = 2 
    blur_size   = 4
    color       = rgba(18, 16, 18, 0.6)
}

# ============================================================
# Hyprlock - Date & Time (Proportioned for 1440x900)
# ============================================================

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %B %d"
    color       = rgba(227, 208, 194, 0.90)
    font_size   = 18
    font_family = JetBrains Mono Bold
    position    = 0, 230
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:1000] date +"%-I:%M"
    color       = rgba(227, 208, 194, 1.0)
    font_size   = 80
    font_family = JetBrains Mono ExtraBold
    position    = 0, 140
    halign      = center
    valign      = center
}

# ============================================================
# Hyprlock - Input Field (Modern Pill & Performance Optimized)
# ============================================================

input-field {
    monitor           =
    size              = 280, 50
    rounding          = -1
    outline_thickness = 2

    outer_color = rgba(183, 133, 108, 0.85)
    inner_color = rgba(18, 16, 18, 0.5)

    font_color       = rgba(227, 208, 194, 1.0)
    placeholder_text = <span foreground="##e3d0c2"><i>Password...</i></span>
    
    # MBA 2017 Performance Tweak: 
    # Reducing dot_size and dots_spacing makes the "dots" render faster 
    # during rapid typing on older integrated GPUs.
    dots_center  = true
    dots_size    = 0.2
    dots_spacing = 0.3
    
    fade_on_empty = true
    fade_timeout  = 1000

    fail_color  = rgba(183, 133, 108, 0.98)
    check_color = rgba(183, 133, 108, 0.98)

    position = 0, -60
    halign   = center
    valign   = center
}